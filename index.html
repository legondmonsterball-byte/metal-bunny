<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea">
<title>Metal Bunny</title>
<meta name="description" content="A polished chrome bunny you can spin, boop and restyle.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1c21; --muted:#8c867f; --line:rgba(40,30,20,.08);
    --glass:rgba(255,255,255,.62);
    --accent:#ff6fa8; --accent-ink:#c93d78;
    --spring:cubic-bezier(.3,1.35,.45,1); --out:cubic-bezier(.2,.9,.25,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 90% at 50% 40%,#fffdfa 0%,#f7f2eb 52%,#ebe3d9 100%);
    color:var(--ink);font-family:Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #c.dragging{cursor:grabbing}

  /* ---------- brand ---------- */
  .brand{position:fixed;top:calc(22px + env(safe-area-inset-top));left:28px;pointer-events:none}
  .brand h1{
    margin:0;font-family:Unbounded,Inter,sans-serif;font-weight:700;
    font-size:clamp(24px,3.1vw,36px);letter-spacing:-.025em;line-height:1;
    background:linear-gradient(180deg,#6b7180 0%,#24262d 47%,#9aa0ad 53%,#34373f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.9));
  }
  .brand p{margin:8px 0 0;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .brand p b{color:var(--accent-ink);font-weight:600;transition:color .4s}

  /* ---------- top tools ---------- */
  .tools{position:fixed;top:calc(20px + env(safe-area-inset-top));right:24px;display:flex;gap:8px}
  .icon-btn{
    width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:1px solid rgba(255,255,255,.75);background:var(--glass);color:#45413c;
    backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 20px -10px rgba(70,45,20,.35);
    transition:transform .18s var(--out),background .25s,color .25s,border-color .25s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.82)}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn[aria-pressed="true"]{
    background:color-mix(in srgb,var(--accent) 15%,rgba(255,255,255,.7));
    color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .icon-btn svg{width:19px;height:19px}

  /* ---------- dock ---------- */
  .dock{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
    width:min(452px,calc(100% - 32px));transform:translateX(-50%);
    padding:8px;border-radius:28px;
    background:var(--glass);border:1px solid rgba(255,255,255,.8);
    backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 60px -30px rgba(80,50,20,.42),0 2px 8px rgba(80,50,20,.05);
  }
  .tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:20px;background:rgba(40,30,20,.045)}
  .tab-pill{
    position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:16px;background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 14px -6px rgba(60,40,20,.22);
    transition:transform .42s var(--spring);
  }
  .tabs button{
    position:relative;z-index:1;border:0;background:none;padding:9px 0;cursor:pointer;
    font:600 13px Inter,sans-serif;color:var(--muted);transition:color .2s;
  }
  .tabs button[aria-selected="true"]{color:var(--ink)}
  .panes{position:relative;height:80px;margin-top:4px}
  .pane{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;
    transition:opacity .2s ease,transform .38s var(--spring);
  }
  .pane.on{opacity:1;transform:none;pointer-events:auto}
  .pane.metal{flex-direction:column;gap:9px}

  .swatches{display:flex;gap:clamp(5px,1.6vw,9px)}
  .swatch{
    --c:#ddd;width:clamp(28px,8vw,34px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:
      radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,0) 22%),
      radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--c) 70%,#fff) 0 28%,transparent 46%),
      radial-gradient(circle at 45% 40%,var(--c) 0 34%,color-mix(in srgb,var(--c) 45%,#111) 78%,color-mix(in srgb,var(--c) 80%,#000) 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 3px 8px -3px rgba(60,40,20,.4);
    transition:transform .25s var(--spring),box-shadow .25s;
  }
  .swatch.holo{background:
      radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,0) 22%),
      conic-gradient(from 200deg,#ffd1ec,#c9b8ff,#a8e6ff,#c9ffd9,#fff2b3,#ffd1ec)}
  .swatch:hover{transform:translateY(-2px)}
  .swatch:active{transform:scale(.9)}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px #fff,0 0 0 4px var(--ink),0 6px 12px -4px rgba(60,40,20,.45);transform:translateY(-2px)}
  .metal-name{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);height:14px}

  .chip{
    flex:1;min-width:0;height:64px;border-radius:18px;border:1px solid transparent;cursor:pointer;
    background:rgba(40,30,20,.04);color:#5a554f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font:600 11.5px Inter,sans-serif;letter-spacing:.01em;
    transition:background .25s,color .25s,border-color .25s,transform .2s var(--out);
  }
  .chip:hover{background:rgba(40,30,20,.07)}
  .chip:active{transform:scale(.95)}
  .chip .g{font-size:15px;line-height:18px;height:18px;font-weight:500;white-space:nowrap}
  .chip svg{width:24px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .chip[aria-pressed="true"]{
    background:color-mix(in srgb,var(--accent) 14%,rgba(255,255,255,.55));
    color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 28%,transparent);
  }

  .hint{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));
    font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em;white-space:nowrap;
    display:flex;align-items:center;gap:8px;pointer-events:none;transition:opacity .6s;
  }
  .hint i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
  .hint.gone{opacity:0}

  /* ---------- intro ---------- */
  .brand,.tools,.dock,.hint{opacity:0}
  .brand{transform:translateY(-8px)}
  .tools{transform:translateY(-8px)}
  .dock{transform:translate(-50%,24px)}
  body.ready .brand,body.ready .tools{opacity:1;transform:none;transition:opacity .6s ease,transform .7s var(--out)}
  body.ready .tools{transition-delay:.08s}
  body.ready .dock{opacity:1;transform:translate(-50%,0);transition:opacity .5s ease .12s,transform .7s var(--spring) .12s}
  body.ready .hint:not(.gone){opacity:1;transition:opacity .6s ease .5s}
  body.calm *{transition-duration:.01s!important;transition-delay:0s!important}

  .nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:24px}
  body.nogl-on .nogl{display:grid}

  @media (max-width:640px){
    .brand{left:18px;top:calc(18px + env(safe-area-inset-top))}
    .tools{right:14px;top:calc(16px + env(safe-area-inset-top));gap:6px}
    .icon-btn{width:38px;height:38px}
    .chip{height:58px;border-radius:16px}
    .hint{bottom:calc(140px + env(safe-area-inset-bottom))}
  }
</style>

<body>
<canvas id="c" tabindex="0" aria-label="Metal Bunny. Drag to spin, click to boop."></canvas>

<header class="brand">
  <h1>Metal Bunny</h1>
  <p>No. 001 · <b id="alloy">Mirror Chrome</b></p>
</header>

<div class="tools">
  <button class="icon-btn" id="spinBtn" aria-pressed="false" aria-label="Turntable" title="Turntable">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>
  </button>
  <button class="icon-btn" id="motionBtn" aria-pressed="true" aria-label="Effects" title="Effects">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5c.5 3.6 1.9 5 5.5 5.5-3.6.5-5 1.9-5.5 5.5-.5-3.6-1.9-5-5.5-5.5 3.6-.5 5-1.9 5.5-5.5Z"/><path d="M18.5 14.5c.25 1.7.8 2.25 2.5 2.5-1.7.25-2.25.8-2.5 2.5-.25-1.7-.8-2.25-2.5-2.5 1.7-.25 2.25-.8 2.5-2.5Z"/></svg>
  </button>
  <button class="icon-btn" id="snapBtn" aria-label="Save picture" title="Save picture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5Z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
  </button>
</div>

<div class="hint" id="hint">Drag to spin <i></i> Tap to boop</div>

<nav class="dock" aria-label="Customize">
  <div class="tabs" role="tablist">
    <span class="tab-pill" id="pill"></span>
    <button role="tab" data-tab="metal" aria-selected="true">Metal</button>
    <button role="tab" data-tab="ears" aria-selected="false">Ears</button>
    <button role="tab" data-tab="face" aria-selected="false">Face</button>
  </div>
  <div class="panes">
    <div class="pane metal on" data-pane="metal">
      <div class="swatches" id="swatches"></div>
      <div class="metal-name" id="metalName"></div>
    </div>
    <div class="pane" data-pane="ears" id="earPane"></div>
    <div class="pane" data-pane="face" id="facePane"></div>
  </div>
</nav>

<div class="nogl">This bunny needs WebGL to shine. Try another browser.</div>

<script type="module">
import * as THREE from 'three';

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('metal-bunny.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('metal-bunny.' + k, JSON.stringify(v)); } catch {} },
};
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* =====================================================================
   Presets
   ===================================================================== */
const METALS = {
  chrome:  { name: 'Mirror Chrome', body: '#e3e6ec', accent: '#ff7fb6', ui: '#ff6fa8', ink: '#c93d78', iri: 0, coat: 0,   rough: .40 },
  bubble:  { name: 'Bubblegum',     body: '#ff9fcc', accent: '#ff4f98', ui: '#ff5c9d', ink: '#c42a6d', iri: 0, coat: .35, rough: .46 },
  ice:     { name: 'Ice Blue',      body: '#a8d7ff', accent: '#ff8cc0', ui: '#3d9bff', ink: '#1d6cc4', iri: 0, coat: .35, rough: .44 },
  lime:    { name: 'Cyber Lime',    body: '#cdf26e', accent: '#ff73b3', ui: '#7cc21a', ink: '#4a8200', iri: 0, coat: .35, rough: .46 },
  lilac:   { name: 'Lilac',         body: '#c9b6ff', accent: '#ff8fca', ui: '#8d6bff', ink: '#6141d6', iri: 0, coat: .35, rough: .44 },
  gold:    { name: 'Gold Leaf',     body: '#ffd17c', accent: '#ff7f98', ui: '#e8a42a', ink: '#9a6500', iri: 0, coat: .2,  rough: .48 },
  holo:    { name: 'Holographic',   body: '#eceaf6', accent: '#a98fff', ui: '#9b7bff', ink: '#6545d8', iri: 1, coat: .3,  rough: .40 },
  gunmetal:{ name: 'Gunmetal',      body: '#5f6571', accent: '#ff5d9e', ui: '#6d7482', ink: '#2f333b', iri: 0, coat: .3,  rough: .52 },
};
// angles in degrees. rr: root roll (outward)  rp: root pitch (back)  bp/br: bend along length  at: where the bend lives  tw: twist
const EARS = {
  perky: { label: 'Perky', L: { rr: 9,  rp: 4,  bp: 14,  br: 3,   at: .62, tw: -6 }, R: { rr: 14, rp: 9,  bp: 22,  br: 14,  at: .66, tw: 10 } },
  flop:  { label: 'Flop',  L: { rr: 13, rp: 6,  bp: 16,  br: 8,   at: .6,  tw: 0 },  R: { rr: 24, rp: 10, bp: 22,  br: 122, at: .47, tw: 6 } },
  lop:   { label: 'Lop',   L: { rr: 80, rp: -4, bp: -10, br: 66,  at: .3,  tw: 72 }, R: { rr: 84, rp: 0,  bp: -6,  br: 74,  at: .33, tw: 76 } },
  swept: { label: 'Swept', L: { rr: 9,  rp: 52, bp: 44,  br: 5,   at: .45, tw: 0 },  R: { rr: 15, rp: 58, bp: 52,  br: 14,  at: .5,  tw: 4 } },
};
const EAR_ICONS = {
  perky: '<circle cx="12" cy="17.5" r="4.5"/><ellipse cx="9.5" cy="7" rx="2" ry="5" transform="rotate(-8 9.5 7)"/><ellipse cx="14.8" cy="7" rx="2" ry="5" transform="rotate(12 14.8 7)"/>',
  flop:  '<circle cx="12" cy="17.5" r="4.5"/><ellipse cx="9.5" cy="7" rx="2" ry="5" transform="rotate(-8 9.5 7)"/><path d="M13.4 13.2 15 6.4c.6-2.4 3.5-2.8 4.9-.8 1 1.5.9 3.8-.1 5.4-.6.9-1.7.6-1.8-.4-.1-1.2-1-1.6-1.6-.6l-1.3 3.6"/>',
  lop:   '<circle cx="12" cy="13" r="5"/><ellipse cx="5.6" cy="15" rx="1.9" ry="4.8" transform="rotate(18 5.6 15)"/><ellipse cx="18.4" cy="15" rx="1.9" ry="4.8" transform="rotate(-18 18.4 15)"/>',
  swept: '<circle cx="12" cy="16.5" r="4.8"/><ellipse cx="7.6" cy="9" rx="1.8" ry="4.6" transform="rotate(-38 7.6 9)"/><ellipse cx="16.6" cy="9" rx="1.8" ry="4.6" transform="rotate(42 16.6 9)"/>',
};
// eo: eye open, arc: ^ closed eye, mw/mc/mo/mop/mt: mouth width/curve/omega/open/top-open, earR/earB: ear droop, hr/hp: head roll/pitch
const FACES = {
  happy:  { label: 'Happy',  g: '•ω•', eoL: 1, eoR: 1, arcL: 0, arcR: 0, es: 1,    heart: 0, mw: .072, mc: .45, mo: 1,  mop: 0,   mt: .1, blush: .55, earR: 0,  earB: 0,  hr: .03,  hp: 0 },
  wink:   { label: 'Wink',   g: '•‿~', eoL: 1, eoR: 0, arcL: 0, arcR: 1, es: 1.03, heart: 0, mw: .085, mc: 1,   mo: .2, mop: .5,  mt: .1, blush: .85, earR: 5,  earB: 6,  hr: .11,  hp: -.02 },
  wow:    { label: 'Wow',    g: '°o°', eoL: 1, eoR: 1, arcL: 0, arcR: 0, es: 1.2,  heart: 0, mw: .04,  mc: 0,   mo: 0,  mop: .85, mt: .8, blush: .3,  earR: -7, earB: -14, hr: 0,   hp: -.07 },
  sleepy: { label: 'Sleepy', g: '–‿–', eoL: .14, eoR: .12, arcL: 0, arcR: 0, es: 1, heart: 0, mw: .045, mc: .25, mo: .5, mop: .1,  mt: .3, blush: .4,  earR: 16, earB: 34, hr: .07,  hp: .12 },
  love:   { label: 'Love',   g: '♥‿♥', eoL: 0, eoR: 0, arcL: 0, arcR: 0, es: 1,    heart: 1, mw: .085, mc: 1.1, mo: .25,mop: .55, mt: .1, blush: 1,   earR: -3, earB: 0,  hr: -.09, hp: -.03 },
  boop:   { eoL: 0, eoR: 0, arcL: 1, arcR: 1, es: 1, heart: 0, mw: .08, mc: 1.1, mo: .2, mop: .62, mt: .1, blush: 1, earR: -6, earB: -6, hr: .05, hp: -.05 },
};

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = {
  metal: store.get('metal', 'chrome'),
  ears: store.get('ears', 'flop'),
  face: store.get('face', 'happy'),
  motion: store.get('motion', !reduceMotion),
  spin: store.get('spin', false),
};
if (!METALS[S.metal]) S.metal = 'chrome';
if (!EARS[S.ears]) S.ears = 'flop';
if (!FACES[S.face] || S.face === 'boop') S.face = 'happy';

/* =====================================================================
   Renderer / scene
   ===================================================================== */
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch (e) {
  document.body.classList.add('nogl-on', 'ready');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 1.66, 0);
let camDist = 9, camEl = 0.1, camElTarget = 0.1;

/* ---------- studio environment (procedural HDR) ---------- */
function makeEnvironment() {
  const W = 512, H = 256, data = new Uint16Array(W * H * 4), toH = THREE.DataUtils.toHalfFloat;
  const wrap = d => Math.abs((((d + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI);
  // lon (atan2(z,x)), lat, half-width, half-height, softness, rgb
  const L = [
    [Math.PI / 2, 1.0, .58, .3, .12, 7.2, 7.0, 6.6],   // overhead key, front
    [Math.PI, .35, .1, .55, .05, 5.6, 5.5, 5.3],        // left strip
    [.05, .3, .08, .5, .04, 4.2, 4.2, 4.2],             // right strip
    [-Math.PI / 2, .42, .58, .09, .05, 4.6, 4.5, 4.3],  // back rim bar
    [2.35, .05, .32, .22, .14, 1.7, .62, 1.05],         // pink card
    [.8, .02, .3, .22, .14, .55, .95, 1.75],            // blue card
  ];
  for (let j = 0; j < H; j++) {
    const lat = ((j + .5) / H - .5) * Math.PI;
    let r, g, b;
    if (lat >= 0) { const t = ss(0, 1.3, lat); r = .8 + .24 * t; g = .77 + .25 * t; b = .73 + .26 * t; }
    else { const t = ss(0, -1.2, lat); r = .68 - .22 * t; g = .62 - .2 * t; b = .56 - .18 * t; }
    const dark = 1 - .86 * (1 - ss(.02, .17, Math.abs(lat - .02)));   // horizon line = chrome definition
    r *= dark; g *= dark; b *= dark;
    const cl = Math.cos(lat);
    for (let i = 0; i < W; i++) {
      const lon = ((i + .5) / W - .5) * 2 * Math.PI;
      let R = r, G = g, B = b;
      for (const l of L) {
        const m = (1 - ss(l[2] - l[4], l[2] + l[4], wrap(lon - l[0]) * cl)) * (1 - ss(l[3] - l[4], l[3] + l[4], Math.abs(lat - l[1])));
        if (m > 0) { R += m * l[5]; G += m * l[6]; B += m * l[7]; }
      }
      const o = (j * W + i) * 4;
      data[o] = toH(R); data[o + 1] = toH(G); data[o + 2] = toH(B); data[o + 3] = toH(1);
    }
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.HalfFloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  const pm = new THREE.PMREMGenerator(renderer);
  const env = pm.fromEquirectangular(tex).texture;
  tex.dispose(); pm.dispose();
  return env;
}

    if (k === 0) g.moveTo(Math.cos(a) * 60, Math.sin(a) * 60);
    g.quadraticCurveTo(Math.cos(am) * 9, Math.sin(am) * 9, Math.cos(a2) * 60, Math.sin(a2) * 60);
  }
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 60);
  gr.addColorStop(0, '#fff'); gr.addColorStop(.28, '#fff'); gr.addColorStop(.6, hex); gr.addColorStop(1, hex);
  g.fillStyle = gr; g.fill();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return sparkTexCache[hex] = t;
}
const sparks = [];
for (let i = 0; i < 28; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false, toneMapped: false }));
  sp.visible = false; scene.add(sp);
  sparks.push({ sp, life: 0, max: 1, vel: new THREE.Vector3(), size: .2, spin: 0 });
}
function burst(point, n) {
  if (!S.motion) return;
  const tex = sparkTex(METALS[S.metal].ui);
  let made = 0;
  for (const s of sparks) {
    if (made >= n) break;
    if (s.life > 0) continue;
    s.sp.material.map = tex; s.sp.material.needsUpdate = true;
    s.sp.position.copy(point);
    const a = Math.random() * Math.PI * 2, e = (Math.random() - .3) * 1.2;
    s.vel.set(Math.cos(a) * Math.cos(e), Math.sin(e) + .6, Math.sin(a) * Math.cos(e)).multiplyScalar(1.4 + Math.random() * 1.6);
    s.max = s.life = .55 + Math.random() * .4; s.size = .1 + Math.random() * .14; s.spin = (Math.random() - .5) * 6;
    s.sp.visible = true; made++;
  }
}

/* =====================================================================
   State, interaction, animation
   ===================================================================== */
const E = { ...FACES[S.face] };
const target = { body: new THREE.Color(P0.body), accent: new THREE.Color(P0.accent), iri: P0.iri, coat: P0.coat, rough: P0.rough };
let tempFace = null, tempUntil = 0;
const phys = { y: 0, vy: 0, sq: 0, sqv: 0, yaw: 0, yawVel: 0, prevYaw: 0, introDone: false };
const head = { yaw: 0, pitch: 0, roll: 0, prevYaw: 0, prevPitch: 0, nod: 0, nodV: 0 };
const look = { x: 0, y: 0, active: false, last: 0 };
let time = 0, nextBlink = 1.8, blinkT = -1, nextTwitch = 3, envPulse = 0;
let lastInteraction = 0;

function flashFace(k, dur) { tempFace = k; tempUntil = time + dur; }
function earKick(ear, roll, pitch) { ear.vr += roll; ear.vp += pitch; }

function boop(point) {
  if (phys.y <= 0.001 && phys.vy === 0) { phys.vy = S.motion ? 3.1 : 1.6; phys.sq = -.05; }
  flashFace('boop', .95);
  for (const e of ears) earKick(e, 3 + Math.random() * 3, (Math.random() - .5) * 5);
  burst(point, 10);
}
function earFlick(ear, point) {
  earKick(ear, 7 + Math.random() * 3, (Math.random() - .5) * 8);
  flashFace('wow', .6);
  head.nodV -= 1.5;
  burst(point, 6);
}

/* ---------- pointer ---------- */
const ptr = { down: false, id: -1, sx: 0, sy: 0, lx: 0, ly: 0, lt: 0, moved: false, vel: 0 };
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let usableCenterY = innerHeight / 2;

function hideHint() { $('#hint').classList.add('gone'); }
canvas.addEventListener('pointerdown', e => {
  if (!phys.introDone) skipIntro();
  canvas.setPointerCapture(e.pointerId);
  Object.assign(ptr, { down: true, id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now(), moved: false, vel: 0 });
  phys.yawVel *= .2;
});
canvas.addEventListener('pointermove', e => {
  look.x = clamp((e.clientX - innerWidth / 2) / (innerWidth / 2), -1, 1);
  look.y = clamp((usableCenterY - e.clientY) / (innerHeight / 2), -1, 1);
  look.active = true; look.last = time;
  if (!ptr.down || e.pointerId !== ptr.id) return;
  const now = performance.now(), dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly;
  if (!ptr.moved && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 6) { ptr.moved = true; canvas.classList.add('dragging'); hideHint(); }
  if (ptr.moved) {
    const dYaw = dx * .0105;
    phys.yaw += dYaw;
    const dtp = Math.max(8, now - ptr.lt) / 1000;
    ptr.vel = ptr.vel * .6 + (dYaw / dtp) * .4;
    camElTarget = clamp(camElTarget + dy * .0035, -.04, .48);
  }
  ptr.lx = e.clientX; ptr.ly = e.clientY; ptr.lt = now;
});
function endPointer(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false; canvas.classList.remove('dragging');
  lastInteraction = time;
  if (ptr.moved) {
    phys.yawVel = performance.now() - ptr.lt > 90 ? 0 : clamp(ptr.vel, -14, 14);
  } else {
    hideHint();
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    for (const ear of ears) { ear.outer.geometry.computeBoundingSphere(); ear.inner.geometry.computeBoundingSphere(); }
    const hit = raycaster.intersectObjects(pickables, false)[0];
    if (hit) hit.object.userData.ear ? earFlick(hit.object.userData.ear, hit.point) : boop(hit.point);
  }
  if (e.pointerType !== 'mouse') look.active = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') look.active = false; });
canvas.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') phys.yawVel -= 2.5;
  else if (e.key === 'ArrowRight') phys.yawVel += 2.5;
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); boop(new THREE.Vector3(0, 1.6, .9)); }
});

/* ---------- UI ---------- */
const root$ = document.documentElement;
function applyUiColors() {
  const p = METALS[S.metal];
  root$.style.setProperty('--accent', p.ui); root$.style.setProperty('--accent-ink', p.ink);
  $('#alloy').textContent = p.name; $('#metalName').textContent = p.name;
}
function setMetal(k, fromUser) {
  S.metal = k; store.set('metal', k);
  const p = METALS[k];
  target.body.set(p.body); target.accent.set(p.accent); target.iri = p.iri; target.coat = p.coat; target.rough = p.rough;
  document.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  applyUiColors();
  if (fromUser) { envPulse = 1; for (const e of ears) earKick(e, 2, -1.5); burst(new THREE.Vector3(0, 2.1, .6), 7); }
}
function setEars(k, fromUser) {
  S.ears = k; store.set('ears', k);
  document.querySelectorAll('#earPane .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  if (fromUser) for (const e of ears) earKick(e, (Math.random() - .3) * 4, (Math.random() - .5) * 3);
}
function setFace(k, fromUser) {
  S.face = k; store.set('face', k); tempFace = null;
  document.querySelectorAll('#facePane .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  if (fromUser) { head.nodV += 2.2; if (k === 'love') burst(new THREE.Vector3(0, 2.2, .8), 8); }
}
function setMotion(on) {
  S.motion = on; store.set('motion', on);
  $('#motionBtn').setAttribute('aria-pressed', on);
  document.body.classList.toggle('calm', !on);
}
function setSpin(on) { S.spin = on; store.set('spin', on); $('#spinBtn').setAttribute('aria-pressed', on); }

const sw = $('#swatches');
for (const [k, p] of Object.entries(METALS)) {
  const b = document.createElement('button');
  b.className = 'swatch' + (p.iri ? ' holo' : ''); b.dataset.k = k;
  b.style.setProperty('--c', p.body); b.title = p.name; b.setAttribute('aria-label', p.name);
  b.onclick = () => setMetal(k, true);
  sw.appendChild(b);
}
for (const [k, p] of Object.entries(EARS)) {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.k = k;
  b.innerHTML = `<svg viewBox="0 0 24 24">${EAR_ICONS[k]}</svg><span>${p.label}</span>`;
  b.onclick = () => setEars(k, true);
  $('#earPane').appendChild(b);
}
for (const [k, f] of Object.entries(FACES)) {
  if (!f.label) continue;
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.k = k;
  b.innerHTML = `<span class="g">${f.g}</span><span>${f.label}</span>`;
  b.onclick = () => setFace(k, true);
  $('#facePane').appendChild(b);
}
const tabs = [...document.querySelectorAll('.tabs button')], panes = [...document.querySelectorAll('.pane')];
function setTab(name) {
  tabs.forEach((b, i) => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', on); if (on) $('#pill').style.transform = `translateX(${i * 100}%)`; });
  panes.forEach(p => p.classList.toggle('on', p.dataset.pane === name));
  store.set('tab', name);
}
tabs.forEach(b => b.onclick = () => setTab(b.dataset.tab));
setTab(['metal', 'ears', 'face'].includes(store.get('tab')) ? store.get('tab') : 'metal');
$('#spinBtn').onclick = () => setSpin(!S.spin);
$('#motionBtn').onclick = () => setMotion(!S.motion);
$('#snapBtn').onclick = snapshot;

setMetal(S.metal); setEars(S.ears); setFace(S.face); setMotion(S.motion); setSpin(S.spin);

function snapshot() {
  render();
  const src = renderer.domElement, c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const gr = g.createRadialGradient(w / 2, h * .4, 0, w / 2, h * .4, Math.max(w, h) * .75);
  gr.addColorStop(0, '#fffdfa'); gr.addColorStop(.52, '#f7f2eb'); gr.addColorStop(1, '#ebe3d9');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.drawImage(src, 0, 0);
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = `metal-bunny-${S.metal}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  burst(new THREE.Vector3(0, 2, .7), 6);
}

/* ---------- layout / camera framing ---------- */
const dock = document.querySelector('.dock');
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  const topH = w < 640 ? 84 : 80, botH = dock.getBoundingClientRect().height + 40;
  const yc = (topH + h - botH) / 2, delta = h / 2 - yc;
  usableCenterY = yc;
  const fullH = h + 2 * Math.abs(delta);
  camera.aspect = w / fullH;
  camera.setViewOffset(w, fullH, 0, delta > 0 ? 2 * delta : 0, w, h);
  const tanH = Math.tan(camera.fov * D2R / 2), usable = Math.max(120, h - topH - botH);
  camDist = Math.max((3.55 / 2) / (tanH * usable / fullH), (3.1 / 2) / (tanH * camera.aspect), 7);
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);
layout();

/* ---------- intro ---------- */
function finishIntro() {
  if (phys.introDone) return;
  phys.introDone = true;
  document.body.classList.add('ready');
  flashFace('wink', 1.3);
}
function skipIntro() { phys.y = 0; phys.vy = 0; finishIntro(); }
if (S.motion) { phys.y = 4.6; phys.yaw = -1.6; phys.yawVel = 2.2; }
else finishIntro();
setTimeout(finishIntro, 2600);

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const tmpC = new THREE.Color();
function render() { renderer.render(scene, camera); }

function tick() {
  const dt = clamp(clock.getDelta(), 1 / 240, 1 / 30);
  time += dt;
  const motion = S.motion ? 1 : 0;

  // --- expression blend ---
  if (tempFace && time > tempUntil) tempFace = null;
  const F = FACES[tempFace || S.face], kf = damp(14, dt);
  for (const k in E) if (typeof E[k] === 'number') E[k] += (F[k] - E[k]) * kf;

  // --- ear pose blend (a bit lazy = floppy) ---
  const ke = damp(6, dt);
  for (const ear of ears) { const T = EARS[S.ears][ear.key]; for (const k in ear.cur) ear.cur[k] += (T[k] - ear.cur[k]) * ke; }

  // --- material blend ---
  const km = damp(7, dt);
  metal.color.lerp(target.body, km); enamel.color.lerp(target.accent, km);
  metal.iridescence = Math.max(.001, metal.iridescence + (target.iri - metal.iridescence) * km);
  metal.clearcoat = Math.max(.001, metal.clearcoat + (target.coat - metal.clearcoat) * km);
  metal.roughness += (target.rough - metal.roughness) * km;
  envPulse = Math.max(0, envPulse - dt * 2.2);
  metal.envMapIntensity = 1 + Math.sin(envPulse * Math.PI) * .55 * motion;
  blushMat.color.copy(tmpC.set(0xff6fa3).lerp(target.accent, .35));

  // --- turntable ---
  if (!ptr.down) {
    if (S.spin) phys.yawVel += (.5 - phys.yawVel) * damp(1.5, dt);
    else phys.yawVel *= Math.exp(-dt * 2.4);
    phys.yaw += phys.yawVel * dt;
    if (!S.spin && time - lastInteraction > 4) camElTarget += (.1 - camElTarget) * damp(1, dt);
  }
  const yawRate = (phys.yaw - phys.prevYaw) / dt; phys.prevYaw = phys.yaw;
  root.rotation.y = phys.yaw;
  root.rotation.z = Math.sin(time * .8) * .012 * motion;

  // --- bounce / squash ---
  if (phys.y > 0 || phys.vy > 0) {
    phys.vy -= 15 * dt; phys.y += phys.vy * dt;
    if (phys.y <= 0) {
      const impact = -phys.vy; phys.y = 0;
      phys.sqv += impact * .26;
      phys.vy = impact > 3.2 ? impact * .3 : 0;
      for (const e of ears) e.vr += impact * .5;
      if (!phys.introDone && phys.vy === 0) finishIntro();
    }
  }
  phys.sqv += (-230 * phys.sq - 15 * phys.sqv) * dt; phys.sq += phys.sqv * dt;
  const breathe = Math.sin(time * (S.face === 'sleepy' ? 1.3 : 2.3)) * .009 * (motion * .7 + .3);
  const sq = clamp(phys.sq, -.25, .35);
  squashG.scale.set(1 + sq * .5 - breathe * .3, 1 - sq + breathe, 1 + sq * .5 - breathe * .3);
  root.position.y = phys.y;

  // --- head: follows the pointer, nods, tilts ---
  if (look.active && time - look.last > 3) look.active = false;
  const facing = Math.max(0, Math.cos(phys.yaw));
  const lx = look.active ? look.x : Math.sin(time * .35) * .25 * motion, ly = look.active ? look.y : 0;
  head.nodV += (-80 * head.nod - 8 * head.nodV) * dt; head.nod += head.nodV * dt;
  const kh = damp(5, dt);
  head.yaw += (clamp(lx * .42 * facing - yawRate * .035, -.6, .6) - head.yaw) * kh;
  head.pitch += (clamp(-ly * .2 + E.hp, -.3, .3) - head.pitch) * kh;
  head.roll += (E.hr + Math.sin(time * 1.1) * .03 * motion - lx * .06 * facing - head.roll) * kh;
  headPivot.rotation.set(head.pitch + head.nod * .12 + breathe * .4, head.yaw, head.roll);
  const hYawRate = (head.yaw - head.prevYaw) / dt, hPitchRate = (head.pitch - head.prevPitch) / dt;
  head.prevYaw = head.yaw; head.prevPitch = head.pitch;

  // --- ear physics ---
  if (time > nextTwitch) {
    nextTwitch = time + 2.5 + Math.random() * 5;
    if (motion) { const e = ears[Math.random() * 2 | 0]; earKick(e, 1.6 + Math.random() * 1.5, (Math.random() - .5) * 2); }
  }
  const totYaw = yawRate + hYawRate;
  for (const ear of ears) {
    const tp = -ear.side * totYaw * .12 + hPitchRate * .25 + head.nodV * .02;
    const tr = Math.abs(totYaw) * .06 + phys.vy * .05;
    for (let k = 0; k < 2; k++) {
      const h = dt / 2;
      ear.vp += (55 * (clamp(tp, -1, 1) - ear.sp) - 4.4 * ear.vp) * h; ear.sp += ear.vp * h;
      ear.vr += (55 * (clamp(tr, -1, 1) - ear.sr) - 4.4 * ear.vr) * h; ear.sr += ear.vr * h;
    }
    ear.sp = clamp(ear.sp, -1.4, 1.4); ear.sr = clamp(ear.sr, -1.2, 1.4);
    updateEar(ear, E, time, motion);
  }

  // --- eyes ---
  if (time > nextBlink) { blinkT = 0; nextBlink = time + (Math.random() < .2 ? .28 : 2.2 + Math.random() * 3.6); }
  let blink = 1;
  if (blinkT >= 0) { blinkT += dt; if (blinkT < .15) blink = 1 - Math.sin(blinkT / .15 * Math.PI) * .94; else blinkT = -1; }
  const pulse = 1 + Math.sin(time * 7) * .07 * motion;
  eyes.forEach((e, i) => {
    const open = (i ? E.eoR : E.eoL) * blink, arc = i ? E.arcR : E.arcL;
    e.inner.visible = open > .015;
    e.inner.scale.set(E.es, Math.max(.001, E.es * open), E.es);
    e.inner.position.x = lx * .008 * facing; e.inner.position.y = ly * .006;
    e.arc.visible = arc > .02; e.arc.scale.setScalar(Math.max(.001, arc));
    e.heart.visible = E.heart > .02; e.heart.scale.setScalar(Math.max(.001, E.heart * pulse));
  });
  blushMat.opacity = E.blush * .5;
  updateMouth(E);

  // --- contact shadow + sparkles ---
  const lift = phys.y;
  contact.scale.set((1 + sq * .4) / (1 + lift * .35), (.82 + sq * .3) / (1 + lift * .35), 1);
  contact.material.opacity = 1 / (1 + lift * .6);
  for (const s of sparks) {
    if (s.life <= 0) continue;
    s.life -= dt;
    if (s.life <= 0) { s.sp.visible = false; continue; }
    const k = 1 - s.life / s.max;
    s.vel.multiplyScalar(Math.exp(-dt * 3)); s.vel.y -= dt * 1.2;
    s.sp.position.addScaledVector(s.vel, dt);
    const sc = s.size * (k < .2 ? ss(0, .2, k) * 1.15 : 1.15 - ss(.2, 1, k) * 1.15);
    s.sp.scale.setScalar(Math.max(.001, sc));
    s.sp.material.rotation += s.spin * dt;
  }

  // --- camera ---
  camEl += (camElTarget - camEl) * damp(6, dt);
  camera.position.set(0, camTarget.y + Math.sin(camEl) * camDist, Math.cos(camEl) * camDist);
  camera.lookAt(camTarget);

  render();
}
renderer.setAnimationLoop(tick);
</script>
</body>
